 h+=S.active?`<button class="tile" data-a="resume" style="background:var(--accent);color:var(--accent-ink)">${I.play}<span class="spacer">Retomar treino em andamento</span><span class="num" data-clock>${clock(Date.now()-S.active.start)}</span></button>`:`<button class="tile" data-a="startEmpty">${I.plus}Iniciar treino vazio</button>`;
 h+=`<div class="row" style="margin-top:6px"><h2 class="h spacer" style="margin:0">Rotinas</h2><button class="ib" data-a="newFolder" aria-label="Nova pasta">${I.folder}</button></div><div class="grid2"><button class="tile" data-a="newRoutine">${I.clip}Nova rotina</button><button class="tile" data-a="go" data-v="explorar">${I.search}Explorar</button></div>`;
 for(const g of groups){const rs=S.routines.filter(r=>(r.folderId||'')===g.id);const closed=!!col[g.id||'_'];
  h+=`<div class="fold"><button class="fold-t${closed?' closed':''}" data-a="fold" data-id="${g.id}">${I.caret}${esc(g.name)} (${rs.length})</button>${g.id?`<button class="ib" data-a="folderMenu" data-id="${g.id}" aria-label="Opções da pasta">${I.dots}</button>`:''}</div>`;

 return h+'</main>'};

const SSL='ABCDEFGH';
function ssMap(s){const m={};let k=0;for(const e of s.exercises)if(e.ss&&!(e.ss in m))m[e.ss]=SSL[k++%8];return m}
function fixSS(s){const c={};for(const e of s.exercises)if(e.ss)c[e.ss]=(c[e.ss]||0)+1;for(const e of s.exercises)if(e.ss&&c[e.ss]<2)e.ss=null}
function ssLast(s,i){const e=s.exercises[i];if(!e.ss)return true;for(let j=i+1;j<s.exercises.length;j++)if(s.exercises[j].ss===e.ss)return false;return true}
function ssNext(s,i){const e=s.exercises[i];for(let j=i+1;j<s.exercises.length;j++)if(s.exercises[j].ss===e.ss)return s.exercises[j];return null}
function newEntry(id,s){const prev=prevSets(id,null,Infinity,s&&s.routineId);const n=Math.max(1,Math.min(prev.filter(x=>x.type!=='w').length||3,8));return{exId:id,notes:'',rest:S.profile.rest,ss:null,sets:mkSets(n).map(x=>Object.assign(x,{done:false}))}}
function colsFor(t,k){const ck=k==='routine'?'':' 44px';if(t==='t')return k==='live'?'36px minmax(0,1fr) 40px 74px 44px':`36px minmax(0,1fr) 84px${ck}`;return`36px minmax(0,1fr) 64px 58px${ck}`}
const HEAD={wr:['kg','Reps'],bw:['+kg','Reps'],as:['−kg','Reps'],dt:['km','Min'],t:['Min']};
const incOf=x=>x.equipment==='Halter'?2:x.equipment==='Kettlebell'?4:x.equipment==='Máquina'||x.equipment==='Cabo'?5:2.5;
const rangeTop=e=>{let m=0;for(const st of e.sets){const r=String(st.target||'').match(/(\d+)\s*-\s*(\d+)/);if(r)m=Math.max(m,+r[2])}return m};
function overloadHint(e,i,x,prev){if(S.profile.hints===false||tOf(x)!=='wr')return'';const work=prev.filter(p=>p.type!=='w'&&num(p.kg));if(!work.length||e.sets.some(st=>st.done))return'';const top=rangeTop(e)||12;if(!work.every(p=>(num(p.reps)||0)>=top))return'';const kg=Math.max(...work.map(p=>num(p.kg)))+incOf(x);
 return`<button class="hint" data-a="applyHint" data-e="${i}" data-kg="${kg}">${I.up}<span>Na última vez você fez ${top} reps ou mais em todas as séries. <b>Sugestão: ${fmt(kg)} kg</b></span></button>`}
function exCard(s,e,i,L={}){
 const x=ex(e.exId),t=tOf(x),k=s.kind;
 const prev=prevSets(e.exId,k==='edit'?s.id:null,k==='edit'?s.start:Infinity,s.routineId);
 let n=0;const hd=HEAD[t]||HEAD.wr;
 const head=`<div class="shead"><span>Série</span><span>Anterior</span>${t==='t'&&k==='live'?'<span></span>':''}${hd.map(h=>`<span>${h}</span>`).join('')}${k!=='routine'?`<span>${I.check.replace('class="i"','class="i" style="width:14px;height:14px"')}</span>`:''}</div>`;
 const rows=e.sets.map((st,j)=>{const label=st.type==='n'?++n:SET_L[st.type];const pv=prevFor(prev,e.sets,j);
  const inp=(f,ph,mode)=>`<input class="cell" id="c-${i}-${j}-${f}" inputmode="${mode}" autocomplete="off" data-f="${f}" data-e="${i}" data-s="${j}" value="${esc(st[f]??'')}" placeholder="${esc(ph??'')}" aria-label="${f} série ${j+1}">`;
  const minPh=pv&&pv.t?+(pv.t/60).toFixed(2):'';
  const running=UI.tmr&&UI.tmr.e===i&&UI.tmr.s===j;
  const cells=t==='t'?(k==='live'?`<button class="tmr${running?' on':''}" data-a="setTimer" data-e="${i}" data-s="${j}" aria-label="${running?'Parar':'Iniciar'} cronômetro">${running?'■':'▶'}</button>`:'')+(running?`<span class="cell tmrv" data-tmr>${clock(Date.now()-UI.tmr.start)}</span>`:inp('min',minPh,'decimal')):t==='dt'?inp('km',pv&&pv.km!=null?fmt(pv.km):'','decimal')+inp('min',minPh,'decimal'):inp('kg',pv&&pv.kg!=null?fmt(pv.kg):'','decimal')+inp('reps',pv&&pv.reps!=null?num(pv.reps):(st.target||''),k==='routine'?'text':'numeric');
  return`<div class="srow${st.done?' done':''}"><button class="sn t-${st.type}" data-a="setType" data-e="${i}" data-s="${j}" aria-label="Tipo da série">${label}</button><button class="prev" data-a="usePrev" data-e="${i}" data-s="${j}" ${pv?'':'disabled'}>${pv?setTxt(pv,t):'—'}</button>${cells}${k!=='routine'?`<button class="ck" data-a="check" data-e="${i}" data-s="${j}" aria-label="Concluir série" aria-pressed="${!!st.done}">${I.check}</button>`:''}</div>`}).join('');
 const pin=S.exNotes&&S.exNotes[x.id];
 const last=ssLast(s,i);return`<section class="exc${e.ss?' ss':''}" id="exc-${i}">${e.ss?`<span class="sslab">Supersérie ${L[e.ss]}</span>`:''}<div class="exc-h"><button class="exc-n" data-a="openEx" data-id="${x.id}">${avatar(x,38)}<b>${esc(x.name)}</b></button><button class="ib" data-a="exMenu" data-e="${i}" aria-label="Opções do exercício">${I.dots}</button></div>${pin?`<button class="pinned" data-a="editPin" data-id="${x.id}">${I.note}<span>${esc(pin)}</span></button>`:''}<input class="note" id="n-${i}" data-f="enote" data-e="${i}" value="${esc(e.notes)}" placeholder="Adicionar anotação…">${k==='live'?overloadHint(e,i,x,prev):''}${k==='edit'?'':last?`<button class="restb" data-a="exRest" data-e="${i}">${I.clock}Descanso${e.ss?' após a supersérie':''}: ${fmtRest(e.rest)}</button>`:`<span class="ssnote">${I.link.replace('class="i"','class="i" style="width:16px;height:16px;vertical-align:-3px"')} Sem descanso: siga para o próximo da supersérie</span>`}${k==='routine'&&t==='wr'?`<p class="muted small" style="margin:0 4px">Dica: nas reps, use uma faixa como 8-12 para definir a meta.</p>`:''}<div class="sets" style="--cols:${colsFor(t,k)}">${head}${rows}</div><button class="addset" data-a="addSet" data-e="${i}">+ Adicionar série</button></section>`}
VIEWS.sessao=p=>{
 const s=cur();if(!s){return bar('Treino')+`<main class="page"><p class="empty">Nenhum treino em andamento.</p></main>`}
 const k=s.kind;let h;
 if(k==='live')h=bar('Registrar treino',{left:`<button class="ib" data-a="back" aria-label="Minimizar">${I.down}</button>`,right:`<button class="btn sm pri" data-a="finish">Finalizar</button>`});
 else h=bar(k==='routine'?(p.isNew?'Nova rotina':'Editar rotina'):'Editar treino',{left:`<button class="tb" data-a="back">Cancelar</button>`,right:`<button class="btn sm pri" data-a="${k==='routine'?'saveRoutine':'saveEdit'}">Salvar</button>`});
 h+='<main class="page">';
 if(k==='live'){const st=wStats(s,true);h+=`<input class="title-in" id="l-name" data-f="name" value="${esc(s.name)}" aria-label="Nome do treino"><div class="lstats"><div><span class="lab">Duração</span><b class="acc" data-clock>${clock(Date.now()-s.start)}</b></div><div><span class="lab">Volume</span><b data-stat="vol">${fmtInt(st.vol)} kg</b></div><div><span class="lab">Séries</span><b data-stat="sets">${st.sets}</b></div></div>`}
 else if(k==='routine')h+=`<div class="form"><input class="title-in" id="r-name" data-f="name" placeholder="Título da rotina" value="${esc(s.name)}"><textarea id="r-notes" data-f="snotes" placeholder="Anotações da rotina (opcional)">${esc(s.notes)}</textarea></div>`;
 else h+=`<div class="form"><input class="title-in" id="w-name" data-f="name" value="${esc(s.name)}" placeholder="Nome do treino"><div class="row2"><label class="fld"><span>Início</span><input class="inp" id="w-start" type="datetime-local" data-f="startLocal" value="${toLocalInput(s.start)}"></label><label class="fld"><span>Duração (min)</span><input class="inp" id="w-dur" inputmode="numeric" data-f="durMin" value="${Math.round((s.end-s.start)/6e4)}"></label></div><textarea id="w-notes" data-f="snotes" placeholder="Anotações do treino">${esc(s.notes)}</textarea><p class="muted small" style="margin:0">Desmarque o ✓ de uma série para removê-la ao salvar.</p></div>`;
 if(!s.exercises.length)h+=`<div class="emptybox">${I.dumbbell}<b>${k==='routine'?'Monte sua rotina':'Comece adicionando um exercício'}</b><span>Toque em Adicionar exercício e escolha da lista.</span></div>`;
 const L=ssMap(s);h+=s.exercises.map((e,i)=>exCard(s,e,i,L)).join('');
 h+=`<button class="btn pri wide" data-a="addEx">${I.plus} Adicionar exercício</button>`;
 if(k==='live')h+=`<button class="btn ghost danger wide" data-a="discard">Descartar treino</button>`;
 return h+'<div style="height:70px"></div></main>'};
function updateLiveStats(){const s=cur();if(!s||s.kind!=='live')return;const st=wStats(s,true);const v=$('[data-stat=vol]');if(v)v.textContent=fmtInt(st.vol)+' kg';const n=$('[data-stat=sets]');if(n)n.textContent=st.sets}

function exHistBadges(hist){const out=new Map();const b={kg:0,o:0,v:0};hist.forEach((hh,n)=>{let mk=null,mo=null,mv=null;hh.sets.forEach((s2,i)=>{if(s2.type==='w')return;const kg=num(s2.kg)||0,r=num(s2.reps)||0,o=orm(kg,r);if(!mk||kg>mk.v)mk={i,v:kg};if(!mo||o>mo.v)mo={i,v:o};if(!mv||kg*r>mv.v)mv={i,v:kg*r}});const bd={};const add=(m,l,pv)=>{if(n&&m&&m.v>pv&&m.v>0)(bd[m.i]=bd[m.i]||[]).push(l)};add(mk,'Peso',b.kg);add(mo,'1RM',b.o);add(mv,'Volume',b.v);if(mk)b.kg=Math.max(b.kg,mk.v);if(mo)b.o=Math.max(b.o,mo.v);if(mv)b.v=Math.max(b.v,mv.v);out.set(hh,bd)});return out}

 if(tab==='hist'){if(!hist.length)return h+`<div class="emptybox">${I.clock}<b>Sem histórico ainda</b><span>Quando você registrar um treino com este exercício, as séries aparecem aqui.</span></div></main>`;

 h+=exAnim(x)+exHead(x)+(EQ_TIPS[x.equipment]?`<button class="tipl" data-a="tipInfo" data-k="${esc(x.equipment)}">${I.note}<span>Como registrar exercícios com ${esc(x.equipment.toLowerCase())}</span></button>`:'');

 if(!hist.length)return h+`<div class="emptybox">${I.chart}<b>Sem registros ainda</b><span>Quando você fizer este exercício, a evolução e os recordes aparecem aqui.</span></div>`+pinnedBlock(x)+'</main>';

/* ---------- ESTATÍSTICAS ---------- */
VIEWS.estatisticas=()=>{
 const today=sod(Date.now());const days=[...Array(7)].map((_,i)=>addDays(today,i-6));const sel=UI.statDay;
 const from=sel??days[0],to=sel!=null?addDays(sel,1):addDays(today,1);
 const c7=muscleSets(S.workouts.filter(w=>w.start>=from&&w.start<to));
 const SG=perOf('sg'),[sgA]=perRange(SG.p);const cR=muscleSets(S.workouts.filter(w=>w.start>=sgA));
 const hb=Object.entries(cR).filter(([m])=>m!=='Cardio').sort((a,b)=>b[1]-a[1]);
 const RD=perOf('rad'),[rdA]=perRange(RD.p),rdP=prevRange(RD.p);const g30=muscleSets(S.workouts.filter(w=>w.start>=rdA)),g60=rdP?muscleSets(S.workouts.filter(w=>w.start>=rdP[0]&&w.start<rdP[1])):{};
 const ax=Object.keys(GROUPS);const sumG=(c,g)=>GROUPS[g].reduce((a,m)=>a+(c[m]||0),0);
 const all=S.workouts;const tot={n:all.length,dur:all.reduce((a,w)=>a+(w.end-w.start),0),vol:all.reduce((a,w)=>a+wStats(w).vol,0),sets:all.reduce((a,w)=>a+wStats(w).sets,0)};
 const top=Object.entries(c7).sort((a,b)=>b[1]-a[1]).slice(0,4);
 const MUS=UI.mtl||['Peito','Dorsais','Quadríceps'];const ML=perOf('ml'),mbk=buckets(ML.p,ML.g);const mcs=mbk.map(([a,z])=>muscleSets(S.workouts.filter(w=>w.start>=a&&w.start<z)));
 const series=MUS.map(m=>mcs.map(c=>c[m]||0));
 const TP=perOf('top'),[tFrom]=perRange(TP.p);const cnt={};for(const w of S.workouts){if(w.start<tFrom)continue;for(const id of new Set(w.exercises.map(e=>e.exId)))cnt[id]=(cnt[id]||0)+1}
 const topEx=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,UI.topN||8);
 return bar('Estatísticas')+`<main class="page">
 <button class="tile" data-a="go" data-v="relatorio">${I.cal}<span class="spacer">Relatório mensal</span>${I.chev}</button>
 <h2 class="h">${sel!=null?'Mapa corporal de '+dShort(sel):'Mapa corporal dos últimos 7 dias'}</h2>
 <div class="days7">${days.map(d=>{const has=S.workouts.some(w=>w.start>=d&&w.start<addDays(d,1));return`<button class="dchip${has?' has':''}${d===today?' today':''}${sel===d?' sel':''}" data-a="statDay" data-d="${d}"><span>${DL[new Date(d).getDay()]}</span><b>${new Date(d).getDate()}</b></button>`}).join('')}</div>
 ${bodyMap(c7)}
 <p class="muted small" style="text-align:center;margin:0">${top.length?'Mais trabalhados: '+top.map(([m,v])=>`${m} (${fmt(v)})`).join(', '):'Nenhuma série registrada neste período.'} Toque num dia para filtrar.</p>
 <h3 class="sh">${I.bars.replace('class="i"','class="i" style="width:16px;height:16px;vertical-align:-3px"')} Séries por grupo muscular</h3>
 ${perCtl('sg',{gran:false})}
 ${hb.length?`<div class="hb">${hb.map(([m,v])=>`<span>${m}</span><i style="width:${(v/hb[0][1]*100).toFixed(0)}%"></i><b>${fmt(v)}</b>`).join('')}</div><p class="muted small" style="margin:0">Músculo principal conta 1 série; secundário conta meia. Aquecimento não entra.</p>`:'<p class="empty">Sem séries no período.</p>'}
 <h3 class="sh">${I.radar.replace('class="i"','class="i" style="width:16px;height:16px;vertical-align:-3px"')} Distribuição muscular</h3>
 ${perCtl('rad',{gran:false})}
 ${radar(ax,ax.map(g=>sumG(g30,g)),ax.map(g=>sumG(g60,g)))}
 <div class="legend"><span><i></i>${PER_TXT[RD.p][0].toUpperCase()+PER_TXT[RD.p].slice(1)}</span>${rdP?'<span><i class="o"></i>Período anterior</span>':''}</div>
 <h3 class="sh">${I.chart.replace('class="i"','class="i" style="width:16px;height:16px;vertical-align:-3px"')} Séries por músculo ao longo do tempo</h3>
 ${perCtl('ml')}
 ${multiLine(series,sparseLabels(mbk,6))}
 <div class="legend" style="flex-wrap:wrap">${MUS.map((m,i)=>`<span><i style="background:${SERIES_C[i]}"></i>${m}</span>`).join('')}</div>
 <details class="card"><summary class="small" style="cursor:pointer;font-weight:600">Escolher músculos (até 3)</summary><div class="chips" style="margin-top:10px">${MUSCLES.filter(m=>!['Cardio','Corpo inteiro','Outro'].includes(m)).map(m=>`<button class="chip${MUS.includes(m)?' on':''}" data-a="mtl" data-k="${m}">${m}</button>`).join('')}</div></details>
 <div class="row"><h3 class="sh spacer" style="margin:0">${I.trophy.replace('class="i"','class="i" style="width:16px;height:16px;vertical-align:-3px"')} Exercícios mais feitos</h3></div>${perCtl('top',{gran:false})}
 ${topEx.length?`<div class="list">${topEx.map(([id,n])=>{const x=ex(id);return`<button class="exrow" data-a="openEx" data-id="${id}">${avatar(x,44)}<span class="exrow-t"><b>${esc(x.name)}</b><span class="sub">${n} ${n===1?'vez':'vezes'}</span></span><span class="chev">${I.chev}</span></button>`}).join('')}</div>${Object.keys(cnt).length>(UI.topN||8)?`<button class="btn sec" data-a="topMore">Ver mais</button>`:''}`:'<p class="empty">Nenhum treino no período.</p>'}
 <h3 class="sh">Desde o começo</h3><div class="kv"><div><span class="lab">Treinos</span><b>${tot.n}</b></div><div><span class="lab">Tempo</span><b>${fmtInt(tot.dur/36e5)} h</b></div><div><span class="lab">Volume</span><b>${fmt(tot.vol/1000)} t</b></div><div><span class="lab">Séries</span><b>${fmtInt(tot.sets)}</b></div></div>
 </main>`};

/* ---------- RELATÓRIO MENSAL ---------- */
VIEWS.relatorio=p=>{const off=p.off||0,n0=new Date(),M=new Date(n0.getFullYear(),n0.getMonth()+off,1),y=M.getFullYear(),mo=M.getMonth();
 const range=(yy,mm)=>[new Date(yy,mm,1).getTime(),new Date(yy,mm+1,1).getTime()];const [a,z]=range(y,mo),[pa,pz]=range(y,mo-1);
 const ws=S.workouts.filter(w=>w.start>=a&&w.start<z),pw=S.workouts.filter(w=>w.start>=pa&&w.start<pz);
 const sum=list=>({n:list.length,dur:list.reduce((x,w)=>x+(w.end-w.start),0),vol:list.reduce((x,w)=>x+wStats(w).vol,0),sets:list.reduce((x,w)=>x+wStats(w).sets,0)});const c=sum(ws),pc=sum(pw);
 const delta=(v,pv,f)=>{const d=v-pv;return d?`<em class="${d>0?'up':'down'}">${d>0?'↑':'↓'} ${f(Math.abs(d))}</em>`:''};
 const M12=[...Array(12)].map((_,i)=>{const d=new Date(y,mo-11+i,1);const [s0,s1]=range(d.getFullYear(),d.getMonth());return{l:MES[d.getMonth()][0].toUpperCase(),v:S.workouts.filter(w=>w.start>=s0&&w.start<s1).length}});
 const nd=new Date(y,mo+1,0).getDate(),f0=S.profile.weekStart||0,days=new Set(ws.map(w=>new Date(w.start).getDate()));
 let cal=[...Array(7)].map((_,i)=>`<span class="wd">${DL[(i+f0)%7]}</span>`).join('')+'<span></span>'.repeat((M.getDay()-f0+7)%7);for(let d=1;d<=nd;d++)cal+=`<span class="cd${days.has(d)?' has':''}">${d}</span>`;
 const ax=Object.keys(GROUPS),sumG=(cc,g)=>GROUPS[g].reduce((x,m)=>x+(cc[m]||0),0),mc=muscleSets(ws),pmc=muscleSets(pw);
 const mus=Object.entries(mc).filter(([m])=>m!=='Cardio').sort((a2,b2)=>b2[1]-a2[1]);const cnt={};for(const w of ws)for(const id of new Set(w.exercises.map(e=>e.exId)))cnt[id]=(cnt[id]||0)+1;const top=Object.entries(cnt).sort((a2,b2)=>b2[1]-a2[1]);
 const lim=p.more?99:6;
 let h=bar('Relatório mensal')+`<main class="page"><div class="row"><button class="ib" data-a="repNav" data-d="-1" aria-label="Mês anterior">${I.left}</button><h2 class="h spacer" style="text-align:center;margin:0">${MESL[mo]} ${y}</h2><button class="ib" data-a="repNav" data-d="1" aria-label="Próximo mês" ${off>=0?'disabled style="opacity:.3"':''}>${I.chev}</button></div>`;
 h+=`<section class="card form"><span class="lab">Treinos por mês</span><svg class="chart" viewBox="0 0 340 120" role="img">${(()=>{const mx=niceMax(Math.max(1,...M12.map(q=>q.v)));return M12.map((q,i)=>{const bh=(q.v/mx)*86,x=8+i*27.5;return`<rect class="bx${i===11?' now':''}" x="${x}" y="${96-bh}" width="18" height="${bh}" rx="3"><title>${q.v} treinos</title></rect><text class="ax" x="${x+9}" y="112" text-anchor="middle">${q.l}</text>${i===11&&q.v?`<text class="ax" x="${x+9}" y="${92-bh}" text-anchor="middle" style="font-weight:700;fill:var(--fg)">${q.v}</text>`:''}`}).join('')})()}</svg></section>`;
 h+=`<h3 class="sh">Resumo · comparado ao mês anterior</h3><div class="kv rep"><div><span class="lab">Treinos</span><b>${c.n}</b>${delta(c.n,pc.n,fmtInt)}</div><div><span class="lab">Duração</span><b>${fmtDur(c.dur)}</b>${delta(c.dur,pc.dur,fmtDur)}</div><div><span class="lab">Volume</span><b>${fmtInt(c.vol)} kg</b>${delta(c.vol,pc.vol,v=>fmtInt(v)+' kg')}</div><div><span class="lab">Séries</span><b>${c.sets}</b>${delta(c.sets,pc.sets,fmtInt)}</div></div>`;
 h+=`<div class="row"><h3 class="sh spacer" style="margin:0">Dias de treino</h3><span class="tag amb">${I.flame.replace('class="i"','class="i" style="width:14px;height:14px;vertical-align:-2px"')} ${streakWeeks()} sem. seguidas</span></div><div class="cal mcal">${cal}</div>`;
 if(ws.length){h+=`<h3 class="sh">Distribuição muscular</h3>${radar(ax,ax.map(g=>sumG(mc,g)),ax.map(g=>sumG(pmc,g)))}<div class="legend"><span><i></i>${MESL[mo]}</span><span><i class="o"></i>${MESL[(mo+11)%12]}</span></div>`;
  h+=`<h3 class="sh">Principais grupos musculares · séries</h3><div class="hb">${mus.slice(0,lim).map(([m,v])=>`<span>${m}</span><i style="width:${(v/mus[0][1]*100).toFixed(0)}%"></i><b>${fmt(v)}</b>`).join('')}</div>`;
  h+=`<h3 class="sh">Principais exercícios</h3><div class="list">${top.slice(0,lim).map(([id,n])=>{const x=ex(id);return`<button class="exrow" data-a="openEx" data-id="${id}">${avatar(x,44)}<span class="exrow-t"><b>${esc(x.name)}</b><span class="sub">${n} ${n===1?'vez':'vezes'}</span></span><span class="chev">${I.chev}</span></button>`}).join('')}</div>${(mus.length>6||top.length>6)&&!p.more?`<button class="btn sec" data-a="repMore">Ver tudo</button>`:''}`}
 else h+=`<p class="empty">Nenhum treino em ${MESL[mo]}.</p>`;
 return h+'</main>'};

VIEWS.calendario=p=>{const now=new Date();const m=new Date(now.getFullYear(),now.getMonth()+(p.off||0),1);const y=m.getFullYear(),mo=m.getMonth();const nd=new Date(y,mo+1,0).getDate();

 h+=`<div class="kv">${MF.filter(([k])=>latest[k]!=null).map(([k,l,u])=>`<div><span class="lab">${l}</span><b>${fmt(latest[k])}</b> <span class="muted small">${u}</span></div>`).join('')}</div>

 <h3 class="sh">Importar do Hevy</h3>

/* ---------- DADOS PESSOAIS, ÁGUA E SAÚDE ---------- */
const dkey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtM=cm=>(cm/100).toFixed(2).replace('.',',');
function latestMeasure(k,before=Infinity){const ms=S.measures.filter(m=>num(m[k])!=null&&m.date<before).sort((a,b)=>b.date-a.date);return ms[0]?{v:num(ms[0][k]),date:ms[0].date}:null}
function ageOf(b){if(!b)return null;const[y,m,d]=String(b).split('-').map(Number);if(!y)return null;const n=new Date();let a=n.getFullYear()-y;if(n.getMonth()+1<m||(n.getMonth()+1===m&&n.getDate()<d))a--;return a>=10&&a<120?a:null}
const ACT=[['sed','Sedentário',1.2,'Pouco ou nenhum exercício'],['leve','Leve',1.375,'1 a 2 treinos por semana'],['mod','Moderado',1.55,'3 a 4 treinos por semana'],['alto','Alto',1.725,'5 a 6 treinos por semana'],['muito','Muito alto',1.9,'Treino diário intenso ou trabalho físico pesado']];
const perWeek4=()=>S.workouts.filter(w=>w.start>=addDays(sod(Date.now()),-27)).length/4;
function autoAct(){const n=perWeek4();return n<0.5?ACT[0]:n<2.5?ACT[1]:n<4.5?ACT[2]:n<6.5?ACT[3]:ACT[4]}
function actOf(){const k=S.profile.activity||'auto';return k==='auto'?autoAct():(ACT.find(a=>a[0]===k)||autoAct())}
const GOALS=[['perder','Perder gordura'],['manter','Manter peso'],['ganhar','Ganhar massa']];
function bodyData(){const p=S.profile;const w=latestMeasure('weight');const h=num(p.height);const age=ageOf(p.birth);const missing=[];if(!p.sex)missing.push('sexo');if(!age)missing.push('data de nascimento');if(!h)missing.push('altura');if(!w)missing.push('peso');return{w:w&&w.v,wDate:w&&w.date,h,age,sex:p.sex,missing,ok:!missing.length}}
const mifflin=(w,h,a,sex)=>10*w+6.25*h-5*a+(sex==='m'?5:-161);
const r50=v=>Math.round(v/50)*50;
function waterGoal(ts=Date.now()){const p=S.profile;const k=dkey(ts);const trainH=S.workouts.filter(w=>dkey(w.start)===k).reduce((a,w)=>a+(w.end-w.start),0)/36e5;const extra=r50(trainH*500);
 if(num(p.waterManual))return{ml:num(p.waterManual),how:'Meta personalizada (definida por você)'};
 const b=bodyData();if(!b.w)return{ml:2000+extra,def:true,how:'Meta padrão de 2.000 ml. Informe peso e sexo em Dados pessoais para calcular a sua.'+(extra?` +${fmtInt(extra)} ml pelo treino de hoje.`:'')};
 const f=b.sex==='f'?31:b.sex==='m'?35:33;const base=r50(b.w*f);return{ml:base+extra,base,extra,how:`${fmt(b.w)} kg × ${f} ml = ${fmtInt(base)} ml${extra?` + ${fmtInt(extra)} ml pelo treino de hoje`:''}`}}
const waterOn=k=>(S.water&&S.water[k]||[]).reduce((a,x)=>a+x.ml,0);
const cupsOf=()=>{const c=(S.profile.cups||[]).map(Number).filter(v=>v>0);return c.length?c:[200,300,500,750]};
function waterStreak(){let d=sod(Date.now());if(waterOn(dkey(d))<waterGoal(d).ml)d=addDays(d,-1);let n=0;while(n<3650&&waterOn(dkey(d))>=waterGoal(d).ml&&waterOn(dkey(d))>0){n++;d=addDays(d,-1)}return n}

function waterSeries(){const o=perOf('agua'),bk=buckets(o.p,o.g),today=sod(Date.now());const wk=Object.keys(S.water||{}).filter(k=>(S.water[k]||[]).length).sort()[0];const f0=wk?(()=>{const[y,m,d]=wk.split('-').map(Number);return new Date(y,m-1,d).getTime()})():today;
 return bk.map(([a,z,l])=>{let tot=0,gs=0,n=0,hit=0;for(let d=Math.max(a,f0);d<z&&d<=today;d=addDays(d,1)){const v=waterOn(dkey(d)),gm=waterGoal(d).ml;tot+=v;gs+=gm;n++;if(v>0&&v>=gm)hit++}return{a,z,l,avg:n?tot/n:0,goal:n?gs/n:0,n,hit,tot}})}
function waterChart(rows,g){const W=340,H=160,pl=34,pb=20,pt=8;const max=niceMax(Math.max(1,...rows.map(r=>r.avg),...rows.map(r=>r.goal)));const bw=(W-pl)/rows.length;const Y=v=>pt+(H-pt-pb)*(1-v/max);let gg='';const labs=sparseLabels(rows.map(r=>[0,0,r.l]));
 for(let i=0;i<=2;i++){const v=max*i/2,y=Y(v);gg+=`<line class="grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-5}" y="${y+3}" text-anchor="end">${v>=1000?fmt(v/1000)+'L':fmtInt(v)}</text>`}
 rows.forEach((r,i)=>{const x=pl+i*bw+bw*.18,w=Math.max(1.5,bw*.64),ok=r.avg>0&&r.avg>=r.goal;gg+=`<rect class="bx${ok?' now':''}" x="${x.toFixed(1)}" y="${Y(r.avg).toFixed(1)}" width="${w.toFixed(1)}" height="${(H-pb-Y(r.avg)).toFixed(1)}" rx="${Math.min(4,w/2).toFixed(1)}"><title>${r.l}: ${fmtInt(r.avg)} ml${g==='dia'?'':' por dia'} · meta ${fmtInt(r.goal)} ml</title></rect>`;if(rows.length<=40)gg+=`<line x1="${(x-2).toFixed(1)}" x2="${(x+w+2).toFixed(1)}" y1="${Y(r.goal).toFixed(1)}" y2="${Y(r.goal).toFixed(1)}" stroke="var(--fg)" stroke-width="1.3" stroke-dasharray="3 2" opacity=".5"/>`;if(labs[i])gg+=`<text class="ax" x="${(x+w/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${labs[i]}</text>`});

VIEWS.agua=()=>{const now=Date.now(),k=dkey(now),log=(S.water&&S.water[k])||[],tot=waterOn(k),g=waterGoal(now),pct=g.ml?tot/g.ml:0,C=2*Math.PI*84;
 const WO=perOf('agua'),wrows=waterSeries(),wn=wrows.reduce((a,r)=>a+r.n,0),wtot=wrows.reduce((a,r)=>a+r.tot,0),hit=wrows.reduce((a,r)=>a+r.hit,0);

async function snapshot(reason){try{if(!REGS.current||(!S.workouts.length&&!S.routines.length))return;const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction('snaps','readwrite');tx.objectStore('snaps').put({ts:Date.now(),pid:REGS.current,reason,n:S.workouts.length,data:backupText()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});const old=(await listSnaps()).slice(7);if(old.length){const tx=db.transaction('snaps','readwrite');old.forEach(z=>tx.objectStore('snaps').delete(z.ts))}}catch(e){}}

VIEWS.config.after=async()=>{const el=$('#snaps');if(!el)return;const l=await listSnaps();el.innerHTML=l.length?l.map(z=>`<div class="mrow"><span><b class="small">${new Date(z.ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</b><br><span class="muted small">${esc(z.reason)} · ${z.n} treinos</span></span><button class="btn sm sec" data-a="snapRestore" data-ts="${z.ts}">Restaurar</button></div>`).join(''):'<p class="muted small">Nenhuma cópia ainda. A primeira é feita quando houver treinos salvos.</p>'};
const backupText=()=>JSON.stringify(Object.assign({},S,{active:null,app:'carga',perfil:S.profile.name,exportedAt:new Date().toISOString()}));
function download(name,text,type){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return true}catch(e){return false}}
const csvq=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
const MEN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const hevyDate=ts=>{const d=new Date(ts);return`${d.getDate()} ${MEN[d.getMonth()]} ${d.getFullYear()}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
function exportCSV(){const L=['title,start_time,end_time,description,exercise_title,superset_id,exercise_notes,set_index,set_type,weight_kg,reps,distance_km,duration_seconds,rpe'];for(const w of [...S.workouts].sort((a,b)=>b.start-a.start)){const M=ssMap(w);for(const e of w.exercises)e.sets.forEach((s,i)=>L.push([w.name,hevyDate(w.start),hevyDate(w.end),w.notes,ex(e.exId).name,e.ss?SSL.indexOf(M[e.ss]):'',e.notes,i,{n:'normal',w:'warmup',d:'dropset',f:'failure'}[s.type]||'normal',s.kg??'',s.reps??'',s.km??'',s.t??'',''].map(csvq).join(',')))}return L.join('\n')}
function restoreFrom(text){let o;try{o=JSON.parse(text)}catch(e){toast('Esse texto não é um backup válido.');return}if(!o||!Array.isArray(o.workouts)){toast('Backup não reconhecido: faltam os treinos.');return}
 ask('Restaurar backup?',`O backup${o.perfil?` de ${esc(o.perfil)}`:''} tem ${o.workouts.length} treino(s) e ${(o.routines||[]).length} rotina(s). Os dados atuais do perfil ${esc(S.profile.name)} serão substituídos. Uma cópia deles fica guardada em Cópias automáticas.`,'Restaurar',true).then(async ok=>{if(!ok)return;closeSheet();await snapshot('Antes de restaurar');const b=blank();S=Object.assign(b,o,{profile:Object.assign(b.profile,o.profile||{},{name:pname(REGS.current)}),active:null});delete S.app;delete S.exportedAt;delete S.perfil;recomputePRs();persist();applyAccent();toast('Backup restaurado');tab('inicio')})}

/* ---------- recorde ao vivo, anilhas ---------- */
function livePR(s,e,st,x,t){if(S.profile.livePR===false)return;if(!UI.bb||UI.bb.id!==s.id)UI.bb={id:s.id,b:bestsBefore(s.start)};const b=UI.bb.b[e.exId];if(!b)return;
 const kg=num(st.kg)||0,r=num(st.reps)||0,done=s.exercises.filter(z=>z.exId===e.exId).flatMap(z=>z.sets).filter(z=>z.done&&z!==st&&z.type!=='w');
 const prevMax=f=>Math.max(0,...done.map(f));let msg='';
 if(t==='wr'&&st.type!=='w'){if(kg>b.maxKg&&kg>prevMax(z=>num(z.kg)||0))msg=`Maior peso: ${fmt(kg)} kg`;else if(orm(kg,r)>b.best1+1e-9&&orm(kg,r)>prevMax(z=>orm(num(z.kg)||0,num(z.reps)||0)))msg=`1RM estimado: ${fmt(orm(kg,r))} kg`;else if(kg*r>b.setVol&&kg*r>prevMax(z=>(num(z.kg)||0)*(num(z.reps)||0)))msg=`Melhor série: ${fmtInt(kg*r)} kg`}
 else if((t==='bw'||t==='as')&&r>b.maxReps&&r>prevMax(z=>num(z.reps)||0))msg=`Mais repetições: ${r}`;
 if(msg){setTimeout(()=>toast('Novo recorde! '+msg),350);if(S.profile.sound)beep()}}
const PLATES=[25,20,15,10,5,2.5,1.25];
function plateSheet(){const P=UI.plate;const side=Math.max(0,(P.kg-P.bar)/2);let rem=side;const used=[];for(const pl of PLATES){while(rem>=pl-1e-9){used.push(pl);rem-=pl}}
 sheet(`<h3>Calculadora de anilhas</h3><div class="row2"><label class="fld"><span>Peso total (kg)</span><input class="inp" id="pl-kg" inputmode="decimal" data-f="plKg" value="${esc(P.kg)}"></label><label class="fld"><span>Barra (kg)</span><input class="inp" id="pl-bar" inputmode="decimal" data-f="plBar" value="${esc(P.bar)}"></label></div>
 <div id="pl-out">${plateOut(side,used,rem)}</div><button class="btn sec" data-a="closeSheet">Fechar</button>`)}
function plateOut(side,used,rem){return`<p style="margin:0">Em cada lado: <b style="color:var(--fg)">${fmt(side)} kg</b></p><div class="plates">${used.length?used.map(p=>`<span class="plate" style="--s:${(.55+p/25*.45).toFixed(2)}">${fmt(p)}</span>`).join(''):'<span class="muted small">Só a barra.</span>'}</div>${rem>0.01?`<p class="small">Sobram ${fmt(rem)} kg por lado que não fecham com as anilhas comuns (25, 20, 15, 10, 5, 2,5 e 1,25 kg).</p>`:''}`}

 setType:d=>{const s=cur(),e=s.exercises[+d.e],j=+d.s;menu('Tipo de série',[...Object.entries(SET_T).map(([k,l])=>({label:l+(e.sets[j].type===k?' ✓':''),icon:`<b class="num" style="width:22px;text-align:center;font-size:18px">${SET_L[k]||'1'}</b>`,f:()=>{e.sets[j].type=k;save();rerender();updateLiveStats()}})),{label:'Remover série',icon:I.trash,danger:true,f:()=>{e.sets.splice(j,1);save();rerender();updateLiveStats()}}])},
 addSet:d=>{const s=cur(),e=s.exercises[+d.e];const l=e.sets[e.sets.length-1];e.sets.push({type:'n',kg:l?l.kg:'',reps:l?l.reps:'',target:l?l.target||'':'',km:l?l.km||'':'',min:l?l.min:'',done:false});save();rerender()},
 usePrev:d=>{const s=cur(),e=s.exercises[+d.e],st=e.sets[+d.s];const pv=prevFor(prevSets(e.exId,s.kind==='edit'?s.id:null,s.kind==='edit'?s.start:Infinity,s.routineId),e.sets,+d.s);if(!pv)return;st.kg=strv(pv.kg);st.reps=strv(pv.reps);st.km=strv(pv.km);st.min=pv.t?String(+(pv.t/60).toFixed(2)):'';save();rerender();updateLiveStats()},
 check:d=>{audioInit();const s=cur(),ei=+d.e,e=s.exercises[ei],st=e.sets[+d.s];const x=ex(e.exId),t=tOf(x);
  if(UI.tmr&&UI.tmr.e===ei&&UI.tmr.s===+d.s)A.setTimer(d);
  if(!st.done){const pv=prevFor(prevSets(e.exId,s.kind==='edit'?s.id:null,s.kind==='edit'?s.start:Infinity,s.routineId),e.sets,+d.s);
   if(pv){if(st.kg===''&&pv.kg!=null)st.kg=strv(pv.kg);if(st.reps===''&&pv.reps!=null)st.reps=strv(pv.reps);if(st.min===''&&pv.t)st.min=String(+(pv.t/60).toFixed(2));if((st.km==null||st.km==='')&&pv.km!=null)st.km=strv(pv.km)}
   const ok=t==='t'?num(st.min):t==='dt'?(num(st.min)||num(st.km)):num(st.reps);
   if(!ok){toast(t==='t'?'Informe o tempo da série.':t==='dt'?'Informe a distância ou o tempo.':'Informe as repetições da série.');return}
   st.done=true;
   if(s.kind==='live'){livePR(s,e,st,x,t);
    if(ssLast(s,ei)){if(e.rest)startRest(e.rest)}else{const nx=ssNext(s,ei);if(nx){toast('Supersérie: agora '+ex(nx.exId).name);if(S.profile.ssScroll!==false){const ni=s.exercises.indexOf(nx);setTimeout(()=>{const el=$('#exc-'+ni);el&&el.scrollIntoView({behavior:'smooth',block:'start'})},60)}}}}}else st.done=false;
  save();rerender();updateLiveStats()},
 setTimer:d=>{const s=cur(),i=+d.e,j=+d.s;if(UI.tmr&&UI.tmr.e===i&&UI.tmr.s===j){const st=s.exercises[i].sets[j];st.min=String(+((Date.now()-UI.tmr.start)/6e4).toFixed(2));UI.tmr=null;save()}else UI.tmr={e:i,s:j,start:Date.now()};rerender()},
 applyHint:d=>{const s=cur(),e=s.exercises[+d.e];e.sets.forEach(st=>{if(st.type!=='w'&&!st.done)st.kg=String(d.kg)});save();rerender();toast('Carga sugerida aplicada')},
 warmup:d=>{const s=cur(),e=s.exercises[+d.e],x=ex(e.exId);const prev=prevSets(e.exId,null,Infinity,s.routineId).filter(p=>p.type!=='w');const first=e.sets.find(st=>st.type!=='w'&&num(st.kg));const base=first?num(first.kg):prev.length?Math.max(...prev.map(p=>num(p.kg)||0)):0;
  if(!base){toast('Informe o peso da primeira série para calcular o aquecimento.');return}
  const step=x.equipment==='Halter'?1:x.equipment==='Kettlebell'?2:x.equipment==='Máquina'||x.equipment==='Cabo'?2.5:2.5,minW=x.equipment==='Barra'?20:0;const rnd=v=>Math.max(minW,Math.round(v/step)*step);
  const ws=[[.4,10],[.6,6],[.8,3]].map(([p,r])=>({type:'w',kg:String(rnd(base*p)),reps:String(r),target:'',km:'',min:'',done:false}));e.sets=ws.concat(e.sets.filter(st=>st.type!=='w'||st.done));save();rerender();toast(`Aquecimento: 40%, 60% e 80% de ${fmt(base)} kg`)},
 plates:d=>{const s=cur(),e=s.exercises[+d.e];const st=e.sets.find(z=>!z.done&&num(z.kg))||e.sets.find(z=>num(z.kg));UI.plate={kg:st?num(st.kg):60,bar:ex(e.exId).equipment==='Barra'?20:0};plateSheet()},
 editPin:d=>{const cur0=(S.exNotes&&S.exNotes[d.id])||'';sheet(`<h3>Nota fixada</h3><p>Aparece sempre que você registrar ${esc(ex(d.id).name)}. Use para ajustes da máquina, pegada ou lembretes.</p><textarea id="ask-in" maxlength="300" placeholder="Ex.: banco na posição 4, pegada aberta">${esc(cur0)}</textarea><div class="ask-b"><button class="btn sec" data-a="${cur0?'delPin':'closeSheet'}" data-id="${d.id}">${cur0?'Remover':'Cancelar'}</button><button class="btn pri" data-a="savePin" data-id="${d.id}">Salvar</button></div>`)},
 savePin:d=>{const v=$('#ask-in').value.trim();S.exNotes=S.exNotes||{};if(v)S.exNotes[d.id]=v;else delete S.exNotes[d.id];save();closeSheet();rerender()},
 delPin:d=>{if(S.exNotes)delete S.exNotes[d.id];save();closeSheet();rerender()},
 restAdj:d=>{const a=S.active;if(!a||!a.restEnd)return;a.restEnd+=(+d.d)*1000;a.restTotal=Math.max(1,a.restTotal+(+d.d));if(a.restEnd<=Date.now())a.restEnd=null;save();restBar();schedRest()},
 restSkip:()=>{if(S.active){S.active.restEnd=null;clearTimeout(restTO);save();restBar();closeNotifs()}},
 finish:()=>{const s=S.active;if(!s)return;if(!wStats(s,true).sets){toast('Marque pelo menos uma série com ✓ para salvar.');return}go('finish',{})},
 discard:()=>ask('Descartar treino?','Tudo o que foi registrado nesta sessão será perdido.','Descartar',true).then(ok=>{closeSheet();if(ok){S.active=null;unwake();persist();tab('treino')}}),
 saveLive:()=>{const s=S.active;if(!s)return;const w=toWorkout(s,Date.now());if(!w.exercises.length){toast('Nenhuma série concluída.');return}
  if(s.updRoutine){const r=S.routines.find(x=>x.id===s.routineId);if(r){r.exercises=s.exercises.map(e=>({exId:e.exId,notes:e.notes,rest:e.rest,ss:e.ss||null,sets:e.sets.map(st=>({type:st.type,kg:st.kg,reps:st.target||st.reps,km:st.km,min:st.min}))}))}}
  S.workouts.push(w);S.active=null;unwake();clearTimeout(restTO);closeNotifs();recomputePRs();persist();snapshot('Após treino');stack=[{v:'inicio',p:{}}];go('treinoDetalhe',{id:w.id,fresh:true})},
 saveRoutine:()=>{const s=cur();if(!s.name.trim()){toast('Dê um título à rotina.');$('#r-name')?.focus();return}if(!s.exercises.length){toast('Adicione pelo menos um exercício.');return}
  const r={id:s.id,name:s.name.trim(),notes:s.notes,folderId:s.folderId||null,exercises:s.exercises.map(e=>({exId:e.exId,notes:e.notes,rest:e.rest,ss:e.ss||null,sets:e.sets.map(st=>({type:st.type,kg:st.kg,reps:st.reps,km:st.km,min:st.min}))}))};
  const i=S.routines.findIndex(x=>x.id===r.id);i<0?S.routines.push(r):S.routines[i]=r;save();toast('Rotina salva');back()},
 saveEdit:()=>{const s=cur();const w=toWorkout(s,s.end);if(!w.exercises.length){toast('O treino precisa de pelo menos uma série marcada.');return}const i=S.workouts.findIndex(x=>x.id===w.id);if(i>=0)S.workouts[i]=w;recomputePRs();persist();toast('Treino atualizado');back()},
 wMenu:d=>{const w=S.workouts.find(x=>x.id===d.id);if(!w)return;menu(w.name,[
  {label:'Editar treino',icon:I.edit,f:()=>editWorkout(w)},
  {label:'Repetir este treino',icon:I.play,f:()=>startFrom(w.exercises,w.name,w.routineId)},
  {label:'Salvar como rotina',icon:I.clip,f:()=>{S.routines.push(routineFromWorkout(w));save();toast('Rotina criada na aba Treino')}},
  {label:'Excluir treino',icon:I.trash,danger:true,f:()=>A.delWorkout({id:w.id})}])},
 delWorkout:d=>ask('Excluir treino?','Ele sai do histórico e das estatísticas. Não dá para desfazer.','Excluir',true).then(ok=>{closeSheet();if(ok){S.workouts=S.workouts.filter(x=>x.id!==d.id);recomputePRs();persist();toast('Treino excluído');tab(stack[0].v)}}),
 pm:d=>{UI.pm=d.k;rerender()},
 statDay:d=>{const v=+d.d;UI.statDay=UI.statDay===v?null:v;rerender()},
 perP:d=>{const o=perOf(d.key);o.p=d.k;o.g=GRANS[d.k][0];rerender()},
 perG:d=>{perOf(d.key).g=d.k;rerender()},
 calNav:d=>{const p=top_().p;p.off=Math.min(0,(p.off||0)+(+d.d));p.day=null;rerender()},
 calDay:d=>{const p=top_().p;p.day=p.day===+d.d?null:+d.d;rerender()},
 mField:d=>{top_().p.f=d.k;rerender()},
 newMeasure:()=>{const last=[...S.measures].sort((a,b)=>b.date-a.date)[0]||{};const m={id:uid(),date:sod(Date.now())};go('medidaForm',{isNew:true,m,last})},
 editMeasure:d=>{const m=S.measures.find(x=>x.id===d.id);if(m)go('medidaForm',{m:JSON.parse(JSON.stringify(m))})},
 saveMeasure:()=>{const m=top_().p.m;if(!MF.some(([k])=>num(m[k])!=null)){toast('Preencha pelo menos uma medida.');return}const c={id:m.id,date:m.date};for(const[k]of MF)if(num(m[k])!=null)c[k]=num(m[k]);const i=S.measures.findIndex(x=>x.id===c.id);i<0?S.measures.push(c):S.measures[i]=c;save();toast('Medidas salvas');back()},
 delMeasure:()=>{const m=top_().p.m;S.measures=S.measures.filter(x=>x.id!==m.id);save();back()},
 pRest:d=>{S.profile.rest=+d.k;save();rerender()},
 backupSheet:()=>{MENU=[];const sh=canShareFile();sheet(`<h3>Backup e exportação</h3><p>O backup guarda tudo: treinos, rotinas, exercícios e medidas. Guarde fora do celular (Google Drive, e-mail, WhatsApp) para restaurar neste ou em outro aparelho.</p>${S.profile.lastBackup?`<p class="small">Último backup: ${new Date(S.profile.lastBackup).toLocaleDateString('pt-BR')}</p>`:''}${sh?`<button class="btn pri" data-a="shareBackup">${I.share} Salvar no Drive, e-mail ou WhatsApp</button>`:''}<button class="btn ${sh?'sec':'pri'}" data-a="dlBackup">${I.downl} Baixar arquivo de backup</button><button class="btn sec" data-a="copyBackup">${I.copy} Copiar backup como texto</button><button class="btn ghost" data-a="dlCSV">Exportar treinos em CSV (formato Hevy)</button>`)},
 shareBackup:()=>{let f;try{f=new File([backupText()],bkName('txt'),{type:'text/plain'})}catch(e){return}navigator.share({files:[f],title:'Backup do Carga'}).then(()=>{markBackup();closeSheet();toast('Backup enviado');rerender()},e=>{if(e&&e.name!=='AbortError')toast('Não deu para compartilhar. Use Baixar arquivo.')})},
 snoozeBackup:()=>{S.profile.backupSnooze=Date.now()+3*DAY;save();rerender()},
 snapRestore:async d=>{const z=(await listSnaps()).find(x=>x.ts===+d.ts);if(z)restoreFrom(z.data)},
 dlBackup:()=>{const ok=download(bkName('json'),backupText(),'application/json');if(ok)markBackup();toast(ok?'Se o download não começar, use Copiar como texto.':'Download indisponível aqui. Use Copiar como texto.')},
 copyBackup:()=>{const t=backupText();navigator.clipboard.writeText(t).then(()=>{markBackup();toast('Backup copiado. Cole num lugar seguro, como suas notas.')},()=>{sheet(`<h3>Copie o texto</h3><textarea id="bk-txt" style="min-height:200px">${esc(t)}</textarea><button class="btn sec" data-a="closeSheet">Fechar</button>`);const ta=$('#bk-txt');ta.focus();ta.select()})},
 dlCSV:()=>{const ok=download(`carga-treinos-${toDateInput(Date.now())}.csv`,exportCSV(),'text/csv');toast(ok?'Exportação iniciada.':'Download indisponível aqui.')},
 pasteRestore:()=>{sheet(`<h3>Restaurar backup</h3><p>Cole abaixo o texto do backup.</p><textarea id="ask-in" style="min-height:160px" placeholder='{"v":1,...}'></textarea><div class="ask-b"><button class="btn sec" data-a="closeSheet">Cancelar</button><button class="btn pri" data-a="doPaste">Restaurar</button></div>`)},
 doPaste:()=>{const t=$('#ask-in').value;closeSheet();restoreFrom(t)},
 wipe:()=>ask('Apagar todos os dados deste perfil?','Treinos, rotinas, exercícios personalizados e medidas de '+esc(S.profile.name)+' serão apagados. Os outros perfis não são afetados. Faça um backup antes se quiser guardar.','Apagar tudo',true).then(async ok=>{closeSheet();if(ok){await snapshot('Antes de apagar tudo');S=blank();S.profile.name=pname(REGS.current);persist();applyAccent();toast('Dados apagados');tab('treino')}}),
};

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOpen())closeSheet();if(e.key==='Enter'&&e.target.id==='ask-in'&&e.target.tagName==='INPUT')A.askOk()});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;const p=top_().p;const v=t.value;
 if(f==='q'){p.q=v;$('#exlist').innerHTML=exListHTML(p,top_().v==='picker');return}

 if(f==='nxName'){p.f.name=v;return} if(f==='nxMu'){p.f.muscle=v;return} if(f==='nxEq'){p.f.equipment=v;return}
 if(f==='mDate'){const d=v.split('-');if(d.length===3)p.m.date=new Date(+d[0],d[1]-1,+d[2]).getTime();return}
 if(f==='mVal'){p.m[t.dataset.k]=v;return}
 if(f==='pd'){const k=t.dataset.k;S.profile[k]=k==='height'?(num(v)&&num(v)>=100&&num(v)<=250?num(v):S.profile[k]):v;save();return}
 if(f==='pdWeight'){const n=num(v);if(n&&n>=20&&n<=400){const d=sod(Date.now());let m=S.measures.find(x=>x.date===d);if(!m){m={id:uid(),date:d};S.measures.push(m)}m.weight=n;save()}return}
 if(f==='pname'){S.profile.name=v;const r=REGS.list.find(x=>x.id===REGS.current);if(r&&v.trim()){r.name=v.trim();saveReg()}save();return}
 if(f==='pf'){S.profile[t.dataset.k]=t.checked;save();if(t.dataset.k==='wake'&&!t.checked)unwake();if(t.dataset.k==='notify'&&t.checked)askNotify(t);return}
 if(f==='plKg'||f==='plBar'){UI.plate[f==='plKg'?'kg':'bar']=num(v)||0;const P=UI.plate,side=Math.max(0,(P.kg-P.bar)/2);let rem=side;const used=[];for(const pl of PLATES){while(rem>=pl-1e-9){used.push(pl);rem-=pl}}$('#pl-out').innerHTML=plateOut(side,used,rem);return}
 if(f==='impMu'){const x=S.exercises.find(z=>z.id===t.dataset.id);if(x){x.muscle=v;save()}return}
 const s=cur();if(!s)return;
 if(f==='name'){s.name=v}else if(f==='snotes'){s.notes=v}else if(f==='updRoutine'){s.updRoutine=t.checked}
 else if(f==='enote'){s.exercises[+t.dataset.e].notes=v}
 else if(f==='startLocal'){const d=new Date(v).getTime();if(!isNaN(d)){const dur=s.end-s.start;s.start=d;s.end=d+dur}}
 else if(f==='durMin'){const m=num(v);if(m!=null&&m>0)s.end=s.start+m*6e4}
 else if(f==='kg'||f==='reps'||f==='min'||f==='km'){s.exercises[+t.dataset.e].sets[+t.dataset.s][f]=v;updateLiveStats()}
 if(s.kind==='live')save()});
document.addEventListener('change',async e=>{const t=e.target,k=t.dataset.file;if(!k||!t.files||!t.files[0])return;const file=t.files[0];if(k==='photo'){t.value='';try{S.profile.photo=await makePhoto(file);persist();closeSheet();rerender();toast('Foto do perfil atualizada')}catch(err){toast('Não foi possível abrir essa imagem. Tente outra foto.')}return}let text='';try{text=await file.text()}catch(err){toast('Não foi possível ler o arquivo.');return}t.value='';
 if(k==='hevy'){await snapshot('Antes de importar');try{const r=importHevy(text);importResult(r);rerender()}catch(err){toast(err.message||'Falha ao importar.')}}
 if(k==='restore')restoreFrom(text)});
async function makePhoto(file){const url=URL.createObjectURL(file);try{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const sz=320,c=document.createElement('canvas');c.width=c.height=sz;const m=Math.min(im.naturalWidth,im.naturalHeight);c.getContext('2d').drawImage(im,(im.naturalWidth-m)/2,(im.naturalHeight-m)/2,m,m,0,0,sz,sz);return c.toDataURL('image/jpeg',.82)}finally{URL.revokeObjectURL(url)}}
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('cell'))setTimeout(()=>{try{e.target.select()}catch(_){}},0)});

try{history.replaceState({n:1},'')}catch(e){useHist=false}
applyAccent();
(()=>{const sp=document.getElementById('splash');if(!sp)return;const end=()=>{if(sp.classList.contains('out'))return;sp.classList.add('out');const m=document.querySelector('meta[name="theme-color"]');if(m&&m.dataset.c)m.setAttribute('content',m.dataset.c);setTimeout(()=>sp.remove(),520)};document.documentElement.classList.remove('sp-on');setTimeout(end,2600);sp.addEventListener('click',end)})();
render();
if(S.active){wake();schedRest()}
autoSnapshot();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&window.self===window.top){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
